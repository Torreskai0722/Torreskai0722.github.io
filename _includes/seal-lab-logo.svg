  <ellipse cx="52" cy="152" rx="20" ry="10" transform="rotate(-28 52 152)" fill="#E0E0E3"/>
  <ellipse cx="128" cy="164" rx="18" ry="9" transform="rotate(18 128 164)" fill="#E0E0E3"/>
  <!-- spots -->
  <circle cx="66" cy="66" r="3.5" fill="#D3D3D7"/>
  <circle cx="132" cy="60" r="3" fill="#D3D3D7"/>
  <circle cx="126" cy="130" r="3.5" fill="#D3D3D7"/>
  <circle cx="72" cy="128" r="2.5" fill="#D3D3D7"/>
  <!-- blush -->
  <ellipse cx="70" cy="102" rx="9" ry="5" fill="#F7A8B8"/>
  <ellipse cx="130" cy="102" rx="9" ry="5" fill="#F7A8B8"/>
  <!-- eyes -->
  <circle cx="82" cy="86" r="8" fill="#1F1F24"/>
  <circle cx="118" cy="86" r="8" fill="#1F1F24"/>
  <circle cx="79" cy="83" r="3" fill="#FFFFFF"/>
