  <circle cx="85" cy="89" r="1.4" fill="#FFFFFF"/>
  <circle cx="121" cy="89" r="1.4" fill="#FFFFFF"/>
  <!-- nose + mouth -->
  <path d="M95 99 L105 99 L100 105 Z" fill="#1F1F24" stroke="#1F1F24" stroke-width="2" stroke-linejoin="round"/>
  <path d="M92 108 Q96 113 100 108 Q104 113 108 108" fill="none" stroke="#1F1F24" stroke-width="2.4" stroke-linecap="round"/>
  <!-- whiskers -->
