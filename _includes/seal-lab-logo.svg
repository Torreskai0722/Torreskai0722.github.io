  <!-- wordmark -->
  <text x="212" y="112" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="6" textLength="320" lengthAdjust="spacingAndGlyphs" fill="currentColor">SEAL</text>
  <text x="214" y="152" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="2.4" textLength="520" lengthAdjust="spacingAndGlyphs" fill="#CC0000">SAFE AND EFFICIENT AUTONOMY LABORATORY</text>
</svg>
