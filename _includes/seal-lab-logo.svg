<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="seal-logo-title" class="seal-lab-logo">
  <title id="seal-logo-title">SEAL Lab — Safe and Efficient Autonomy Laboratory</title>
  <circle cx="100" cy="100" r="94" fill="#CC0000"/>
  <!-- tail flukes -->
  <path d="M132 150 C 150 140, 166 146, 176 158 C 164 160, 152 168, 146 176 C 140 168, 132 160, 132 150 Z" fill="#E8E8EA"/>
  <!-- body -->
  <ellipse cx="98" cy="142" rx="60" ry="36" fill="#F4F4F6"/>
  <!-- head -->
  <circle cx="100" cy="88" r="52" fill="#F4F4F6"/>
